<!DOCTYPE html>
<html>
<head>
    <title>Witmad</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        body {
            background: #0b0b0e;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
        }
        h1 {
            color: #0070d1;
            font-size: 60px;
            margin-bottom: 5px;
            text-align: center;
        }
        p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .btn {
            background: #0070d1;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:hover, .btn:focus {
            background: #005fa3;
            color: #fff;
            outline: none;
        }
    </style>
</head>
<body>
    <h1>Witmad</h1>
    <p>Selecciona tu contenido:</p>
    <div class="container">
        <a class="btn" href="#">Witmad App</a>
    </div>

    <!-- Script de compatibilidad para evitar errores de renderizado en la PS3 -->
    <script>
        if (typeof window.onload === 'function') {
            window.onload();
        }
    </script>
</body>
</html>
