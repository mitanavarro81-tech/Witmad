<html>
<head>
    <title>Witmad</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        body { 
            background: #0b0b0e; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 30px; 
        }
        h1 { 
            color: #0070d1; 
            font-size: 60px; 
            margin-bottom: 5px; 
            text-align: center;
        }
        p { 
            color: #aaa; 
            font-size: 16px; 
            margin-bottom: 30px; 
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .btn { 
            display: block; 
            width: 100%;
            padding: 15px 20px;
            background: #16161a;
            border: 2px solid #0070d1;
            border-radius: 8px;
            font-size: 20px; 
            font-weight: bold;
            color: #fff; 
            text-decoration: none; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:hover, .btn:focus { 
            background: #0070d1; 
            color: #fff;
            outline: none;
        }
    </style>
</head>
<body>
                  <h1>Witmad</h1>
    <p>Selecciona tu contenido:</p>
    <div class="container">
        <a class="btn" href="#">Witmad App</a>
    </div>
</body>
</html>
